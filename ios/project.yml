name: SetSync
options:
  bundleIdPrefix: com.domingoruizb
  deploymentTarget:
    iOS: "17.0"
packages:
  ConnectIQ:
    url: https://github.com/garmin/connectiq-companion-app-sdk-ios
    exactVersion: 1.8.0
targets:
  SetSync:
    type: application
    platform: iOS
    sources:
      - App/Sources
    dependencies:
      - package: ConnectIQ
    info:
      path: App/Sources/Info.plist
      properties:
        CFBundleDisplayName: SetSync
        # Without a launch screen, iOS treats the app as unoptimized for
        # current screen sizes and renders it letterboxed/scaled to a
        # legacy compatibility resolution instead of full-screen. An empty
        # UILaunchScreen dict is the modern, storyboard-free way to opt
        # into native full-screen rendering.
        UILaunchScreen: {}
        # Garmin Connect Mobile communication (specs/modules/02-ios-core-and-sync.md §5).
        NSBluetoothAlwaysUsageDescription: "SetSync uses Bluetooth to receive completed sets from your Garmin watch."
        NSBluetoothPeripheralUsageDescription: "SetSync uses Bluetooth to receive completed sets from your Garmin watch."
        UIBackgroundModes:
          - bluetooth-central
        # Required by Garmin's ConnectIQ Mobile SDK so the app can check for
        # and hand off to Garmin Connect Mobile (gcm-ciq), and so GCM can
        # call back into this app via its own registered URL scheme.
        LSApplicationQueriesSchemes:
          - gcm-ciq
        CFBundleURLTypes:
          - CFBundleURLName: com.domingoruizb.setsync
            CFBundleURLSchemes:
              - setsync-ciq
        # HealthKit: reads daily steps/calories (specs/modules/02-ios-core-and-sync.md §3)
        # and, since the post-launch Apple Health export feature, writes
        # completed workouts as HKWorkout entries so other apps (e.g.
        # Strava, via its own free Health sync) can pick them up.
        NSHealthShareUsageDescription: "SetSync lee tus pasos y calorías diarias para mostrarlos en tu resumen de Hoy."
        NSHealthUpdateUsageDescription: "SetSync guarda tus entrenamientos de fuerza en Salud para que otras apps, como Strava, puedan sincronizarlos."
    entitlements:
      path: App/Sources/SetSync.entitlements
      properties:
        com.apple.developer.healthkit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.domingoruizb.setsync
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
